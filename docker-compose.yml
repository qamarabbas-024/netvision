version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netvision-postgres
    restart: always
    environment:
      POSTGRES_USER: netvision
      POSTGRES_PASSWORD: netvision_secret_password
      POSTGRES_DB: netvision_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U netvision -d netvision_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netvision-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
