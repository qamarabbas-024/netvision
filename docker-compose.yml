services:
  postgres:
    image: postgres:16-alpine
    container_name: netvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netvision_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-netvision_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - netvision-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-netvision} -d ${POSTGRES_DB:-netvision_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netvision-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - netvision-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  netvision-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
