packages:
  - 'frontend'
  - 'backend'
  - 'packages/*'

overrides:
  body-parser: '>=1.20.6'
  file-type: '>=21.3.2'
  glob@10: '>=10.5.0'
  js-yaml@4: '>=4.3.1'
  lodash: '>=4.18.1'
  multer: '>=2.2.0'
  nanoid: '>=3.3.18'
  picomatch@4: '>=4.0.5'
  postcss: '>=8.5.26'
  qs: '>=6.15.3'
  tmp: '>=0.2.7'
  ajv@8: '>=8.20.0'
  webpack@5: '>=5.109.2'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  prisma: true

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - 'argon2'
  - 'prisma'
