<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="nStrokeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Subtle Network Coordinate Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <line x1="64" y1="160" x2="448" y2="160" stroke-dasharray="6 6" />
    <line x1="64" y1="256" x2="448" y2="256" stroke-dasharray="6 6" />
    <line x1="64" y1="352" x2="448" y2="352" stroke-dasharray="6 6" />
    <line x1="160" y1="64" x2="160" y2="448" stroke-dasharray="6 6" />
    <line x1="256" y1="64" x2="256" y2="448" stroke-dasharray="6 6" />
    <line x1="352" y1="64" x2="352" y2="448" stroke-dasharray="6 6" />
  </g>

  <!-- Topology Links (The NetVision 'N' Constellation) -->
  <path d="M 160 360 L 160 152 L 352 360 L 352 152" fill="none" stroke="url(#nStrokeGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 160 360 L 160 152 L 352 360 L 352 152" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Network Node Orbs -->
  <!-- Node 1: Bottom Left (Workstation Node) -->
  <circle cx="160" cy="360" r="22" fill="#07090e" stroke="#10b981" stroke-width="7" />
  <circle cx="160" cy="360" r="10" fill="#34d399" filter="url(#subtleGlow)" />

  <!-- Node 2: Top Left (Switch Node) -->
  <circle cx="160" cy="152" r="22" fill="#07090e" stroke="#00f0ff" stroke-width="7" />
  <circle cx="160" cy="152" r="10" fill="#00f0ff" filter="url(#subtleGlow)" />

  <!-- Node 3: Bottom Right (Router Node) -->
  <circle cx="352" cy="360" r="22" fill="#07090e" stroke="#00f0ff" stroke-width="7" />
  <circle cx="352" cy="360" r="10" fill="#00f0ff" filter="url(#subtleGlow)" />

  <!-- Node 4: Top Right (Gateway/Cloud Node) -->
  <circle cx="352" cy="152" r="22" fill="#07090e" stroke="#10b981" stroke-width="7" />
  <circle cx="352" cy="152" r="10" fill="#34d399" filter="url(#subtleGlow)" />

  <!-- Central Traveling Packet Data Core -->
  <circle cx="256" cy="256" r="16" fill="#07090e" stroke="#38bdf8" stroke-width="5" />
  <circle cx="256" cy="256" r="8" fill="#ffffff" filter="url(#glow)" />
</svg>
