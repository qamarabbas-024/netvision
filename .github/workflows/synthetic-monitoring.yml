name: External Synthetic Monitoring & Health Probes

on:
  schedule:
    # Run every 15 minutes to keep Render backend warm and verify uptime
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API URL to probe'
        required: false
        default: 'https://netvision-backend.onrender.com'

permissions:
  contents: read

jobs:
  probe:
    name: Probe Production Endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Backend Dependencies
        run: pnpm --filter netvision-backend install --frozen-lockfile

      - name: Execute Synthetic Health Probe Cycle
        env:
          API_URL: ${{ github.event.inputs.target_url || 'https://netvision-backend.onrender.com' }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          cd backend
          npx ts-node -T scripts/external-synthetic-probe.ts --url "$API_URL" --allow-pending
