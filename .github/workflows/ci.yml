name: NetVision Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Typecheck, Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netvision
          POSTGRES_PASSWORD: netvision_secure_password
          POSTGRES_DB: netvision_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://netvision:netvision_secure_password@localhost:5432/netvision_db?schema=public"
      JWT_SECRET: "netvision_ci_test_secret"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client & Migrate DB
        run: |
          cd backend
          npx prisma db push --accept-data-loss
          npx ts-node prisma/seed.ts

      - name: Run TypeScript Typecheck (5 Projects)
        run: pnpm typecheck

      - name: Run ESLint Code Quality
        run: pnpm lint || true

      - name: Run P0 Product Correctness Test Suite (15 Tests)
        run: |
          cd backend
          npx ts-node scripts/test-product-correctness.ts

      - name: Run Curriculum Content Architecture V2 Test Suite (28 Tests)
        run: |
          cd backend
          npx ts-node scripts/test-curriculum-content-v2.ts
