name: NetVision Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Typecheck, Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netvision
          POSTGRES_PASSWORD: netvision_secure_password
          POSTGRES_DB: netvision_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://netvision:netvision_secure_password@localhost:5432/netvision_db?schema=public"
      JWT_SECRET: "netvision_ci_test_secret_must_be_over_32_characters_long"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client & Run Migrations
        run: |
          cd backend
          npx prisma generate
          npx prisma migrate deploy
          npx ts-node prisma/seed.ts

      - name: Run TypeScript Typecheck (5 Projects)
        run: pnpm typecheck

      - name: Run ESLint Code Quality
        run: pnpm lint

      - name: Run Frontend Regression & Unit Tests
        run: pnpm --filter netvision-frontend test

      - name: Run Backend Certification & Product Correctness Suite
        run: |
          cd backend
          npx ts-node scripts/test-product-correctness.ts
          npx ts-node scripts/test-curriculum-content-v2.ts
          npx ts-node scripts/test-drop1-curriculum-reconciliation.ts
          npx ts-node scripts/test-drop2-certification-architecture.ts
          npx ts-node scripts/test-drop3-certificate-issuance.ts
          npx ts-node scripts/test-drop4-mastery.ts
          npx ts-node scripts/test-drop8-capstone-grading.ts

      - name: Build Production Artifacts
        run: pnpm build
