name: NetVision Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Typecheck, Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netvision
          POSTGRES_PASSWORD: netvision_secure_password
          POSTGRES_DB: netvision_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://netvision:netvision_secure_password@localhost:5432/netvision_db?schema=public"
      DIRECT_URL: "postgresql://netvision:netvision_secure_password@localhost:5432/netvision_db?schema=public"
      JWT_SECRET: "netvision_ci_test_secret_must_be_over_32_characters_long"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm --filter "@netvision/*" build

      - name: Database Governance & Workflow Drift Guard
        run: |
          cd backend
          npx ts-node scripts/guard-db-command.ts --scan-workflows

      - name: Generate Prisma Client & Run Migrations
        run: |
          cd backend
          npx prisma generate
          npx prisma migrate deploy
          npx ts-node prisma/seed.ts

      - name: Run TypeScript Typecheck (5 Projects)
        run: pnpm typecheck

      - name: Run ESLint Code Quality
        run: pnpm lint

      - name: Run Enterprise Secret & Credential Scan
        run: node backend/scripts/scan-repository-secrets.js

      - name: Run Frontend Regression & Unit Tests
        run: pnpm --filter netvision-frontend test

      - name: Run Backend Certification & Deployment Readiness Suite
        run: |
          cd backend
          npx ts-node scripts/test-deployment-readiness.ts
          npx ts-node scripts/test-drop-w-legal-compliance.ts
          npx ts-node scripts/test-drop-x-high-stakes-architecture.ts
          npx ts-node scripts/test-product-correctness.ts
          npx ts-node scripts/test-curriculum-content-v2.ts
          npx ts-node scripts/test-drop1-curriculum-reconciliation.ts
          npx ts-node scripts/test-drop2-certification-architecture.ts
          npx ts-node scripts/test-drop3-certificate-issuance.ts
          npx ts-node scripts/test-drop4-mastery.ts
          npx ts-node scripts/test-drop8-standalone.ts
          npx ts-node scripts/test-drop9-standalone.ts
          npx ts-node scripts/test-drop8-capstone-grading.ts
          npx ts-node scripts/test-drop9-certification-integrity.ts
          npx ts-node scripts/test-drop-03-auth-security.ts
          npx ts-node scripts/test-drop-05-distributed-state.ts
          npx ts-node scripts/test-drop-06-prisma-integrity.ts
          npx ts-node scripts/test-drop-10-performance-scalability.ts
          npx ts-node scripts/test-drop-11-devops-consistency.ts
          npx ts-node scripts/test-drop-12-observability-dr.ts
          npx ts-node scripts/test-drop-13-academic-quality.ts
          npx ts-node scripts/test-drop-14-architecture-hardening.ts
          npx ts-node scripts/test-drop-15-security-red-team.ts
          npx ts-node scripts/test-drop-16-database-integrity.ts
          npx ts-node scripts/test-drop-17-production-deployment.ts
          npx ts-node -T scripts/test-drop-18-observability-dr.ts
          npx ts-node -T scripts/test-drop-19-academic-quality.ts
          npx ts-node -T scripts/test-drop-20-public-trust.ts
          npx ts-node -T scripts/test-drop-21-discoverability-a11y-perf.ts
          npx ts-node scripts/test-drop-25-security-failure-semantics.ts
          npx ts-node scripts/test-drop-26-database-governance.ts
          npx ts-node scripts/test-drop-27-external-monitoring.ts
          npx ts-node scripts/test-drop-28-customer-journey.ts
          npx ts-node scripts/test-drop-z-e2e-adversarial.ts

      - name: Build Production Artifacts
        run: pnpm build

      - name: Install Playwright Chromium Browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Certification Suite
        run: pnpm test:e2e
        env:
          CI: true
          NODE_ENV: test
          DATABASE_URL: "postgresql://netvision:netvision_secure_password@localhost:5432/netvision_db?schema=public"
          JWT_SECRET: "netvision_ci_test_secret_must_be_over_32_characters_long"

      - name: Upload Playwright E2E Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14
