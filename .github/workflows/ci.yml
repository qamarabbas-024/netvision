name: NetVision Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run ESLint
        run: pnpm lint

      - name: Check TypeScript types
        run: pnpm typecheck

  test:
    name: Automated Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netvision_user
          POSTGRES_PASSWORD: netvision_secure_password_2026
          POSTGRES_DB: netvision_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      JWT_SECRET: super_secure_ci_test_jwt_secret_min_32_chars_ok
      DATABASE_URL: postgresql://netvision_user:netvision_secure_password_2026@localhost:5432/netvision_db
      CORS_ORIGIN: http://localhost:3000
      API_URL: http://localhost:4000/api/v1
      FRONTEND_URL: http://localhost:3000
      EMAIL_VERIFICATION_ENABLED: "false"
      EMAIL_PROVIDER: "dev"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply Database Migrations & Seed
        run: |
          pnpm --filter netvision-backend prisma:migrate:prod
          pnpm --filter netvision-backend prisma:seed

      - name: Run P0 Product Correctness Test Suite
        run: pnpm --filter netvision-backend test:product:correctness

      - name: Run Anonymous Claim Security Test Suite
        run: pnpm --filter netvision-backend test:claim:security

      - name: Run Security & OAuth/OTP Hardening Tests
        run: pnpm --filter netvision-backend test:security

      - name: Run Content V2 Curriculum Validation Suite
        run: pnpm --filter netvision-backend test:curriculum:content-v2

      - name: Run Error & Empty States Audit Suite
        run: pnpm --filter netvision-backend test:audit:errors

      - name: Run Network Troubleshooting Engine Suite
        run: pnpm --filter netvision-backend test:troubleshooting

      - name: Run Monitoring & Observability Test Suite
        run: pnpm --filter netvision-backend test:monitoring

      - name: Run Resend HTTPS Email & Mock Suite
        run: pnpm --filter netvision-backend test:email:suite

      - name: Run Deployment Readiness Verification
        run: pnpm --filter netvision-backend test:deployment

      - name: Run Beta Auth Verification Suite
        run: pnpm --filter netvision-backend test:beta:auth

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build Monorepo
        run: pnpm build
