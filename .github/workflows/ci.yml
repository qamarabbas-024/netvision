name: NetVision Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Typecheck, Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Typecheck (5 Projects)
        run: pnpm typecheck

      - name: Run ESLint Code Quality
        run: pnpm lint || true

      - name: Run P0 Product Correctness Test Suite (15 Tests)
        run: |
          cd backend
          npx ts-node scripts/test-product-correctness.ts

      - name: Run Curriculum Content Architecture V2 Test Suite (28 Tests)
        run: |
          cd backend
          npx ts-node scripts/test-curriculum-content-v2.ts
